{{- with .Params.takeaways -}}
<section aria-labelledby="a-retenir" class="w-full px-2 mt-8 mb-10 sm:px-4 lg:w-11/12 max-w-5xl">
  <div class="p-4 border border-teal-200 rounded-xl bg-teal-50 sm:p-6 lg:p-8">
    <h2 id="a-retenir" class="flex items-center gap-3 text-xl font-bold text-teal-900">
      <span aria-hidden="true" class="flex items-center justify-center flex-shrink-0 w-9 h-9 rounded-lg bg-teal-100 text-teal-700">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z" />
        </svg>
      </span>
      À retenir
    </h2>
    <ul class="pl-5 mt-4 space-y-3 leading-relaxed text-gray-700 list-disc marker:text-teal-600">
      {{- range . -}}
      <li class="pl-1">{{ . | markdownify | emojify }}</li>
      {{- end -}}
    </ul>
  </div>
</section>
{{- end -}}
