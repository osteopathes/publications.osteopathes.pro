{{- $page := .page -}}
{{- $seo := .seo -}}
<meta property="og:type" content="{{ if $seo.article }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ $seo.url }}">
<meta property="og:title" content="{{ $seo.title }}">
<meta property="og:description" content="{{ $seo.description }}">
<meta property="og:site_name" content="{{ $page.Site.Title }}">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:title" content="{{ $seo.title }}">
<meta name="twitter:description" content="{{ $seo.description }}">
{{- with $page.Resources.GetMatch "cover-image" -}}
<meta property="og:image" content="{{ .Permalink }}">
<meta property="og:image:alt" content="{{ $page.Title }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ .Permalink }}">
<meta name="twitter:image:alt" content="{{ $page.Title }}">
{{- else -}}
<meta name="twitter:card" content="summary">
{{- end -}}
{{- if $seo.article -}}
  {{- if not $page.PublishDate.IsZero -}}
<meta property="article:published_time" content="{{ $page.PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
  {{- end -}}
  {{- if not $page.Lastmod.IsZero -}}
<meta property="article:modified_time" content="{{ $page.Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
  {{- end -}}
{{- end -}}
